    <script type="text/babel">
        const { useState, useEffect, useLayoutEffect, useRef } = React;

        const getRandomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;

        const splitSentences = (text) => {
            if (!text) return [];
            const raw = String(text).replace(/\s+/g, ' ').trim().match(/[^.!?]+[.!?]*/g) || [];
            return raw.map(s => s.trim()).filter(s => s.length > 0).map(s => (/[.!?]$/.test(s) ? s : s + '.'));
        };

        const FIT_PROBE = 100;
        const FitLines = ({ lines, maxPx = 64, minPx = 14, className = "", lineClassName = "", renderLine, safety = 0.985 }) => {
            const ref = useRef(null);
            const [size, setSize] = useState(null);
            const signature = lines.map(l => l.text).join('|') + '#' + maxPx + '#' + minPx;

            useLayoutEffect(() => { setSize(null); }, [signature]);

            useLayoutEffect(() => {
                if (size !== null) return;
                const el = ref.current;
                if (!el) return;
                const rows = Array.from(el.children);
                if (rows.length === 0) return;
                const widest = rows.reduce((m, r) => Math.max(m, r.scrollWidth), 1);
                const totalH = rows.reduce((s, r) => s + r.offsetHeight, 0) || 1;
                const availW = el.clientWidth || 1;
                const availH = el.clientHeight || 1;
                const byWidth = (availW * FIT_PROBE) / widest;
                const byHeight = (availH * FIT_PROBE) / totalH;
                const next = Math.max(minPx, Math.min(maxPx, byWidth * safety, byHeight * safety));
                setSize(next);
            });

            useEffect(() => {
                const again = () => setSize(null);
                window.addEventListener('resize', again);
                window.addEventListener('orientationchange', again);
                let ro = null;
                if (typeof ResizeObserver !== 'undefined' && ref.current) { ro = new ResizeObserver(again); ro.observe(ref.current); }
                return () => { window.removeEventListener('resize', again); window.removeEventListener('orientationchange', again); if (ro) ro.disconnect(); };
            }, []);

            return (
                <div ref={ref} className={className} style={{ fontSize: (size === null ? FIT_PROBE : size) + 'px', visibility: size === null ? 'hidden' : 'visible' }}>
                    {lines.map((l, i) => (
                        <div key={l.key != null ? l.key : i} className={"whitespace-nowrap leading-[1.3] " + lineClassName}>
                            {renderLine ? renderLine(l, i) : l.text}
                        </div>
                    ))}
                </div>
            );
        };
        
        const playSound = (audioRef) => { if(audioRef && audioRef.current) { audioRef.current.currentTime = 0; audioRef.current.play().catch(e=>{}); } };

        const Icons = {

            Eye: ({ size = 44 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>,

                 const parts = wordData.w.split('-');

                 return { target: wordData.w.replace('-', ''), syl1: parts[0], syl2: parts[1], options1: [parts[0], ...d1].sort(()=>Math.random()-0.5), options2: [parts[1], ...d2].sort(()=>Math.random()-0.5), index: idx };
            }
            return { words: [], index: -1 };
        };

        const AbcmatikApp = ({ onExit }) => {
            const [view, setView] = useState('menu');
            const [level, setLevel] = useState(0);
            const [words, setWords] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(-1);
            const [isPlaying, setIsPlaying] = useState(false);
            const [speed, setSpeed] = useState(2);
            
            const [hecePage, setHecePage] = useState(0);
            const [heceSpeed, setHeceSpeed] = useState(2);

            const [storyIndex, setStoryIndex] = useState(0);
            const [pyramidIndex, setPyramidIndex] = useState(0);
            const [syllableIndex, setSyllableIndex] = useState(0);
            
            const [eyeMode, setEyeMode] = useState('grid'); 
            const [lap, setLap] = useState(1); 
            const [maxLaps, setMaxLaps] = useState(2); 

            const [puzzleWord, setPuzzleWord] = useState("");
            const [puzzleShuffled, setPuzzleShuffled] = useState([]);
            const [puzzleSlots, setPuzzleSlots] = useState([]);
            const [puzzleSuccess, setPuzzleSuccess] = useState(false);
            const [puzzleShake, setPuzzleShake] = useState(false);

            const [sylData, setSylData] = useState(null);
            const [selectedSyl1, setSelectedSyl1] = useState(null);
            const [selectedSyl2, setSelectedSyl2] = useState(null);
            const [sylSuccess, setSylSuccess] = useState(false);
            const [shakeLeft, setShakeLeft] = useState(false);
            const [shakeRight, setShakeRight] = useState(false);

            const [printData, setPrintData] = useState(null);

            const timerRef = useRef(null);
            const audioRef = useRef(null);

            const puzzleQueueRef = useRef([]);

            const initPuzzle = () => {
                if (!puzzleQueueRef.current || puzzleQueueRef.current.length === 0) {
                    puzzleQueueRef.current = buildPuzzleQueue();
                }
                const word = puzzleQueueRef.current.shift();
                setPuzzleWord(word); setPuzzleShuffled(shuffleWord(word)); setPuzzleSlots(Array(word.length).fill(null)); setPuzzleSuccess(false);
            };

            const loadContent = () => {
                setIsPlaying(false); setCurrentIndex(-1); setLap(1); clearInterval(timerRef.current);
                if (level === 0) setWords(generateText(0, eyeMode).words);
                else if (level === 1) setWords(generateText(1, null, pyramidIndex).words);
                else if (level === 2) setWords(generateText(2, null, storyIndex).words);
                else if (level === 3) initPuzzle();
                else if (level === 4) { setSylData(generateText(4, null, syllableIndex)); setSelectedSyl1(null); setSelectedSyl2(null); setSylSuccess(false); }
                else if (level === 5) { const pageWords = HECE_OKU_PAGES[hecePage].map((w, i) => ({ id: i, word: w })); setWords(pageWords); }
            };

            const isPrintingRef = useRef(false);

            useEffect(() => {
                if (printData === null) return;
                let cancelled = false;
                let cleanupTimer = null;

                const finish = () => {
                    if (cancelled) return;
                    isPrintingRef.current = false;
                    setPrintData(null);
                };

                const run = async () => {
                    try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
                    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
                    if (cancelled) return;
                    window.addEventListener('afterprint', finish, { once: true });
                    try { window.print(); } catch (e) { finish(); return; }
                    cleanupTimer = setTimeout(finish, 1500);
                };
                run();

                return () => {
                    cancelled = true;
                    window.removeEventListener('afterprint', finish);
                    if (cleanupTimer) clearTimeout(cleanupTimer);
                };
            }, [printData]);

            const handlePrint = (levelToPrint, idx) => {
                if (isPrintingRef.current) return; 
                isPrintingRef.current = true;
                setIsPlaying(false);
                clearInterval(timerRef.current);
                setPrintData({ level: levelToPrint, idx: idx });
            };

            const handleRefresh = () => {
                if (level === 0) setEyeMode(eyeMode === 'grid' ? 'triangle' : 'grid');
                else if (level === 1) setPyramidIndex((pyramidIndex + 1) % PYRAMID_CONTENT.length);
                else if (level === 2) setStoryIndex((storyIndex + 1) % STORIES.length);
                else if (level === 4) setSyllableIndex((syllableIndex + 1) % SYLLABLE_WORDS.length);
                else loadContent();
            };

            const handleSyl1Click = (syl) => {
                if (sylSuccess) return;
                if (syl === sylData.syl1) { setSelectedSyl1(syl); if (selectedSyl2 === sylData.syl2) { setSylSuccess(true); } 
                } else { setShakeLeft(true); setTimeout(() => setShakeLeft(false), 500); }
            };

            const handleSyl2Click = (syl) => {
                if (sylSuccess) return;
                if (syl === sylData.syl2) { setSelectedSyl2(syl); if (selectedSyl1 === sylData.syl1) { setSylSuccess(true); } 
                } else { setShakeRight(true); setTimeout(() => setShakeRight(false), 500); }
            };

            const handlePoolClick = (charObj) => {
                if (puzzleSuccess) return;
                const emptyIdx = puzzleSlots.findIndex(s => s === null);
                if (emptyIdx !== -1) {
                    const newSlots = [...puzzleSlots]; newSlots[emptyIdx] = charObj; setPuzzleSlots(newSlots);
                    setPuzzleShuffled(prev => prev.map(p => p.id === charObj.id ? { ...p, isPlaced: true } : p));
                }
            };

            const handleSlotClick = (index) => {
                if (puzzleSuccess) return;
                const charObj = puzzleSlots[index];
                if (charObj) {
                    const newSlots = [...puzzleSlots]; newSlots[index] = null; setPuzzleSlots(newSlots);
                    setPuzzleShuffled(prev => prev.map(p => p.id === charObj.id ? { ...p, isPlaced: false } : p));
                }
            };

            useEffect(() => {
                if (level === 3 && puzzleSlots.length > 0 && !puzzleSlots.includes(null) && !puzzleSuccess) {
                    if (puzzleSlots.map(s => s.char).join('') === puzzleWord) { setPuzzleSuccess(true); setTimeout(initPuzzle, 2000); 
                    } else { setPuzzleShake(true); setTimeout(() => { setPuzzleShake(false); setPuzzleSlots(Array(puzzleWord.length).fill(null)); setPuzzleShuffled(prev => prev.map(p => ({ ...p, isPlaced: false }))); }, 500); }
                }
            }, [puzzleSlots]);

            useEffect(() => { if (view === 'activity') loadContent(); }, [view, level, eyeMode, storyIndex, pyramidIndex, syllableIndex, hecePage]); 

            useEffect(() => {
                let currentSpeed = level === 5 ? heceSpeed : speed;
                if (isPlaying && level !== 3 && level !== 4 && view === 'activity') {
                    timerRef.current = setInterval(() => {
                        setCurrentIndex((prev) => {
                            if (prev + 1 >= words.length) {
                                if (lap < maxLaps) { setLap(l => l + 1); return 0; } 
                                else { 
                                    setIsPlaying(false); clearInterval(timerRef.current); 
                                    if (level === 1 || level === 2) playSound(audioRef);
                                    return prev; 
                                }
                            }
                            return prev + 1;
                        });
                    }, currentSpeed * 1000);
                } else clearInterval(timerRef.current);
                return () => clearInterval(timerRef.current);
            }, [isPlaying, words, speed, heceSpeed, lap, level]);

            useEffect(() => {
                if (currentIndex >= 0 && level < 3) {
                    const el = document.getElementById(`word-${currentIndex}`);
                    if (!el) return;
                    const r = el.getBoundingClientRect();
                    const outside = r.top < 0 || r.bottom > window.innerHeight || r.left < 0 || r.right > window.innerWidth;
                    if (outside) el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
                }
            }, [currentIndex]);

            const isFinishedReading = lap === maxLaps && currentIndex === words.length - 1;

            return (
                <React.Fragment>
                    <div className={`h-full flex flex-col items-center bg-[#FFFBEB] font-['TemelYazi'] overflow-hidden print-hide ${printData ? 'hidden' : 'flex'}`}>
                        <audio ref={audioRef} src="assets/ses.mp3" preload="auto" />

                        {view === 'menu' && (
                            <div className="flex-1 overflow-y-auto overflow-x-hidden w-full flex flex-col items-center p-4 pb-12 md:p-8 md:pb-16 animate-in relative">
                                <div className="absolute top-4 left-4 z-50">
                                    <button onClick={onExit} className="flex items-center gap-2 bg-white px-4 py-2 rounded-xl shadow-md border-2 border-slate-200 hover:bg-slate-50 transition-colors text-slate-700 font-bold font-sans active:scale-95">
                                        <Icons.Home size={20} /> <span className="hidden sm:inline">ANA MENÜ</span>
                                    </button>
                                </div>

                                <h1 className="text-5xl md:text-8xl font-normal text-[#FF8C42] mt-12 mb-2 tracking-wide drop-shadow-sm text-center">OKUMATİK</h1>
                                <p className="text-slate-500 text-xl md:text-3xl mb-8 md:mb-12 font-normal text-center">1. Sınıf Hızlı Okuma Asistanı</p>

                                <div className="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-8 w-full max-w-5xl mb-8">
                                    <button onClick={() => { setLevel(0); setView('activity'); }} className="bg-white p-4 md:p-8 rounded-3xl md:rounded-[3rem] border-4 md:border-8 border-[#FF8C42] shadow-lg hover:scale-105 transition-transform flex flex-col items-center text-center gap-2 md:gap-4">
                                        <div className="bg-orange-100 p-3 md:p-5 rounded-full text-[#FF8C42]"><Icons.Eye size={36}/></div>
                                        <div><h3 className="text-xl md:text-3xl font-normal text-slate-700">Göz Takibi</h3><p className="hidden md:block text-slate-400">Kasları geliştir</p></div>
                                    </button>
                                    <button onClick={() => { setLevel(5); setView('activity'); }} className="bg-white p-4 md:p-8 rounded-3xl md:rounded-[3rem] border-4 md:border-8 border-pink-400 shadow-lg hover:scale-105 transition-transform flex flex-col items-center text-center gap-2 md:gap-4">
                                        <div className="bg-pink-100 p-3 md:p-5 rounded-full text-pink-500"><Icons.Book size={36}/></div>
                                        <div><h3 className="text-xl md:text-3xl font-normal text-slate-700">Hece Oku</h3><p className="hidden md:block text-slate-400">Hızlı hece takibi</p></div>
                                    </button>
                                    <button onClick={() => { setLevel(4); setView('activity'); }} className="bg-white p-4 md:p-8 rounded-3xl md:rounded-[3rem] border-4 md:border-8 border-purple-400 shadow-lg hover:scale-105 transition-transform flex flex-col items-center text-center gap-2 md:gap-4">
                                        <div className="bg-purple-100 p-3 md:p-5 rounded-full text-purple-500"><Icons.Syllable size={36}/></div>
                                        <div><h3 className="text-xl md:text-3xl font-normal text-slate-700">Heceden Kelimeye</h3><p className="hidden md:block text-slate-400">Heceleri birleştir</p></div>
                                    </button>
                                    <button onClick={() => { setLevel(1); setView('activity'); }} className="bg-white p-4 md:p-8 rounded-3xl md:rounded-[3rem] border-4 md:border-8 border-[#0ea5e9] shadow-lg hover:scale-105 transition-transform flex flex-col items-center text-center gap-2 md:gap-4">
                                        <div className="bg-sky-100 p-3 md:p-5 rounded-full text-[#0ea5e9]"><Icons.Type size={36}/></div>
                                        <div><h3 className="text-xl md:text-3xl font-normal text-slate-700">Hızlı Oku</h3><p className="hidden md:block text-slate-400">Piramit okuma</p></div>
                                    </button>
                                    <button onClick={() => { setLevel(2); setView('activity'); }} className="bg-white p-4 md:p-8 rounded-3xl md:rounded-[3rem] border-4 md:border-8 border-[#10B981] shadow-lg hover:scale-105 transition-transform flex flex-col items-center text-center gap-2 md:gap-4">
                                        <div className="bg-emerald-100 p-3 md:p-5 rounded-full text-[#10B981]"><Icons.Align size={36}/></div>
                                        <div><h3 className="text-xl md:text-3xl font-normal text-slate-700">Metin Oku</h3><p className="hidden md:block text-slate-400">Hikayeleri çalış</p></div>
                                    </button>
                                    <button onClick={() => { setLevel(3); setView('activity'); }} className="bg-white p-4 md:p-8 rounded-3xl md:rounded-[3rem] border-4 md:border-8 border-[#F59E0B] shadow-lg hover:scale-105 transition-transform flex flex-col items-center text-center gap-2 md:gap-4">
                                        <div className="bg-amber-100 p-3 md:p-5 rounded-full text-[#F59E0B]"><Icons.Puzzle size={36}/></div>
                                        <div><h3 className="text-xl md:text-3xl font-normal text-slate-700">Kelime Bul</h3><p className="hidden md:block text-slate-400">Harfleri birleştir</p></div>
                                    </button>
                                </div>
                            </div>
                        )}

                        {view === 'activity' && (
                            <div className="w-full h-full flex flex-col relative overflow-hidden animate-in">
                                <div className="bg-white shadow-md px-3 py-2 md:px-6 md:py-3 flex justify-between items-center z-50 border-b-2 md:border-b-4 border-slate-200 gap-2 shrink-0">
                                    <div className="flex items-center gap-2 flex-wrap">
                                        <button onClick={() => { setIsPlaying(false); setView('menu'); }} className="flex items-center gap-1.5 bg-slate-100 px-3 py-2 rounded-xl text-slate-700 text-sm md:text-xl border border-slate-300 active:scale-95 transition font-sans font-bold">
                                            <Icons.Home size={20} /> <span className="hidden sm:inline">ANA MENÜ</span>
                                        </button>
                                        {(level === 1 || level === 2) && (
                                            <button onClick={() => handlePrint(level, level === 1 ? pyramidIndex : storyIndex)} className="flex items-center gap-1.5 bg-blue-100 px-3 py-2 rounded-xl text-blue-600 text-sm md:text-xl border border-blue-300 active:scale-95 transition font-sans font-bold">
                                                <Icons.Printer size={20} /> <span className="hidden sm:inline">Yazdır</span>
                                            </button>
                                        )}
                                        {level === 5 && (
                                            <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-300 gap-1 font-sans flex-wrap">
                                                {HECE_OKU_PAGES.map((_, i) => (
                                                    <button key={i} onClick={() => { setHecePage(i); setIsPlaying(false); setCurrentIndex(-1); }} className={`px-2 py-1 rounded-lg text-xs md:text-base whitespace-nowrap ${hecePage === i ? 'bg-pink-500 text-white font-bold' : 'text-slate-600 font-bold'}`}>{i + 1}. Sayfa</button>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                    <div className="flex items-center gap-2 sm:gap-4 font-sans">
                                        {level !== 3 && level !== 4 && (
                                            <div className="flex items-center gap-1.5 sm:gap-2 bg-slate-100 px-2.5 py-1.5 md:px-4 md:py-2 rounded-xl border border-slate-300">
                                                <span className="text-slate-500 text-xs md:text-sm font-bold">HIZ:</span>
                                                {level === 5 ? (
                                                    <input type="range" min="2" max="5" step="1" value={heceSpeed} onChange={(e) => setHeceSpeed(Number(e.target.value))} className="w-16 sm:w-28 md:w-36 horizontal-slider" style={{accentColor: '#ec4899'}} />
                                                ) : (
                                                    <input type="range" min="0.5" max="3" step="0.5" value={speed} onChange={(e) => setSpeed(Number(e.target.value))} className="w-16 sm:w-28 md:w-36 horizontal-slider" />
                                                )}
                                                <span className="text-slate-700 text-xs md:text-sm w-6 text-center font-bold">{level === 5 ? heceSpeed : speed}s</span>
                                            </div>
                                        )}
                                        {level !== 5 && (
                                            <button onClick={handleRefresh} className="bg-yellow-400 hover:bg-yellow-500 text-white p-2 md:p-2.5 rounded-xl border-b-2 border-yellow-600 active:scale-95 transition shadow-sm">
                                                <Icons.Refresh size={20} />
                                            </button>
                                        )}
                                        {level !== 3 && level !== 4 && (
                                            <button onClick={() => {
                                                if (isFinishedReading) {
                                                    setLap(1);
                                                    setCurrentIndex(-1);
                                                    setIsPlaying(true);
                                                } else {
                                                    setIsPlaying(!isPlaying);
                                                }
                                            }} className={`flex items-center gap-1.5 px-3 py-1.5 md:px-5 md:py-2 rounded-xl text-white text-sm md:text-lg border-b-2 active:scale-95 transition shadow-sm font-bold ${isFinishedReading ? 'bg-green-500 border-green-700' : (isPlaying ? 'bg-red-500 border-red-700' : 'bg-green-500 border-green-700')}`}>
                                                {isFinishedReading ? <><Icons.RefreshCw size={20}/> TEKRAR OKU</> : (isPlaying ? <><Icons.Pause size={20}/> DUR</> : <><Icons.Play size={20}/> OKU</>)}
                                            </button>
                                        )}
                                    </div>
                                </div>
                                
                                <div className="flex-1 overflow-hidden flex flex-col items-center justify-center p-2 sm:p-4 md:p-8 relative w-full h-full">
                                    {(level === 1 || level === 2) && (
                                        <div className="absolute bottom-4 right-4 md:bottom-8 md:right-8 bg-slate-100/50 backdrop-blur-sm border border-slate-200 text-slate-400 font-sans font-bold px-3 py-1.5 rounded-lg text-xs md:text-sm shadow-sm z-10 select-none">
                                            Tur: {lap} / {maxLaps}
                                        </div>
                                    )}
                                    
                                    {level === 0 && (
                                        eyeMode === 'grid' ? (
                                            <div className="grid grid-cols-5 gap-2 md:gap-8 m-auto max-w-full">
                                                {words.map((item) => <div key={item.id} id={`word-${item.id}`} className={`w-14 h-10 md:w-32 md:h-20 rounded-xl md:rounded-3xl border-2 md:border-4 transition-all ${currentIndex === item.id ? 'bg-yellow-400 border-yellow-600 scale-110 shadow-lg' : 'bg-white border-slate-300'}`}></div>)}
                                            </div>
                                        ) : (
                                            <div className="flex flex-col items-center justify-center gap-2 md:gap-6 m-auto">
                                                {[0, 1, 2, 3, 4].map(lineIdx => (
                                                    <div key={lineIdx} className="flex gap-2 md:gap-6">
                                                        {words.filter(w => w.lineIndex === lineIdx).map(item => <div key={item.id} id={`word-${item.id}`} className={`w-14 h-10 md:w-32 md:h-20 rounded-full border-2 md:border-4 transition-all ${currentIndex === item.id ? 'bg-yellow-400 border-yellow-600 scale-110 shadow-lg' : 'bg-white border-slate-300'}`}></div>)}
                                                    </div>
                                                ))}
                                            </div>
                                        )
                                    )}
                                    {level === 5 && (
                                        <div className="grid grid-cols-3 gap-3 md:gap-12 m-auto max-w-full">
                                            {words.map((item) => (
                                                <div key={item.id} id={`word-${item.id}`} className={`w-24 h-16 md:w-56 md:h-36 rounded-2xl md:rounded-3xl border-4 md:border-8 flex items-center justify-center text-4xl md:text-7xl font-normal transition-all ${currentIndex === item.id ? 'bg-yellow-400 border-yellow-600 scale-110 shadow-lg text-black' : 'bg-white border-black text-black'}`}>{item.word}</div>
                                            ))}
                                        </div>
                                    )}
                                    {level === 1 && (
                                        (() => {
                                            const rows = [0,1,2,3,4,5,6]
                                                .map(n => words.filter(w => w.lineIndex === n))
                                                .filter(r => r.length > 0);
                                            const fitLines = rows.map((rowWords, i) => ({ key: i, text: rowWords.map(w => w.word).join(' '), items: rowWords }));
                                            return (
                                                <FitLines
                                                    lines={fitLines}
                                                    maxPx={72}
                                                    minPx={16}
                                                    className="h-full w-full max-w-6xl flex flex-col justify-evenly items-center px-2 py-2 overflow-hidden"
                                                    lineClassName="w-full flex flex-nowrap justify-center items-center"
                                                    renderLine={(line) => line.items.map(item => (
                                                        <span key={item.id} id={`word-${item.id}`} className={`inline-block px-[0.16em] mx-[0.07em] rounded-xl transition-colors duration-150 ${currentIndex === item.id ? 'bg-yellow-300 border-b-[0.06em] border-yellow-500 shadow-md text-black' : 'text-slate-800'}`}>{item.word}</span>
                                                    ))}
                                                />
                                            );
                                        })()
                                    )}
                                    {level === 2 && (
                                        (() => {
                                            const grouped = []; let currentLine = [];
                                            words.forEach(word => { currentLine.push(word); if (word.isLastWord) { grouped.push(currentLine); currentLine = []; } });
                                            if (currentLine.length > 0) grouped.push(currentLine);
                                            const fitLines = grouped.map((lineWords, i) => ({ key: i, text: lineWords.map(w => w.word).join(' '), items: lineWords }));
                                            return (
                                                <FitLines
                                                    lines={fitLines}
                                                    maxPx={62}
                                                    minPx={16}
                                                    className="h-full w-full max-w-6xl flex flex-col justify-evenly items-center text-center px-2 sm:px-4 py-2 overflow-hidden"
                                                    lineClassName="w-full flex flex-nowrap justify-center items-center"
                                                    renderLine={(line) => line.items.map(item => (
                                                        <span key={item.id} id={`word-${item.id}`} className={`inline-block px-[0.14em] mx-[0.07em] rounded-lg transition-colors duration-150 ${currentIndex === item.id ? 'bg-yellow-300 text-black shadow-md border-b-[0.06em] border-yellow-500' : 'text-slate-900'}`}>{item.word}</span>
                                                    ))}
                                                />
                                            );
                                        })()
                                    )}
                                    {level === 3 && (
                                        <div className={`flex flex-col items-center justify-center gap-6 md:gap-10 w-full max-w-5xl ${puzzleShake ? 'animate-shake' : ''}`}>
                                            <div className="flex flex-wrap justify-center gap-2 sm:gap-3 md:gap-5 bg-white p-3 sm:p-5 md:p-8 rounded-3xl border-4 md:border-8 border-slate-200 shadow-md">
                                                {puzzleSlots.map((charObj, idx) => (
                                                    <div key={idx} onClick={() => handleSlotClick(idx)} className={`w-[4.5rem] h-[4.5rem] sm:w-24 sm:h-24 md:w-32 md:h-32 rounded-2xl md:rounded-3xl flex items-center justify-center text-5xl sm:text-6xl md:text-8xl leading-none border-2 md:border-4 cursor-pointer transition-colors ${charObj ? (puzzleSuccess ? 'bg-green-500 border-green-600 text-white' : 'bg-white border-slate-300 text-black') : 'bg-slate-50 border-slate-300 border-dashed'}`}>{charObj ? charObj.char : ''}</div>
                                                ))}
                                            </div>
                                            <div className="flex flex-wrap justify-center gap-2 sm:gap-3 md:gap-5">
                                                {puzzleShuffled.map(charObj => (
                                                    <div key={charObj.id} onClick={() => !charObj.isPlaced && handlePoolClick(charObj)} className={`w-16 h-16 sm:w-20 sm:h-20 md:w-28 md:h-28 rounded-2xl flex items-center justify-center text-4xl sm:text-5xl md:text-7xl leading-none border-b-4 md:border-b-8 ${charObj.isPlaced ? 'opacity-0 pointer-events-none' : 'bg-yellow-400 border-yellow-600 text-black shadow-md cursor-pointer active:translate-y-1'}`}>{charObj.char}</div>
                                                ))}
                                            </div>
                                            {puzzleSuccess && <div className="text-5xl md:text-8xl text-green-500 animate-pop-rotate font-normal">HARİKA!</div>}
                                        </div>
                                    )}
                                    {level === 4 && sylData && (
                                        <div className="flex flex-col items-center justify-center h-full w-full max-w-6xl gap-6 md:gap-10 py-2">
                                            <div className="flex justify-center items-center gap-4 sm:gap-6 md:gap-10 w-full">
                                                <div className="flex flex-wrap sm:flex-nowrap justify-center gap-2 sm:gap-4 md:gap-6">
                                                    {sylData.options1.map((s, i) => (

                                            <div className="flex flex-col items-center gap-4 md:gap-6 mt-2 md:mt-4 w-full">
                                                <div className="flex gap-4 sm:gap-6 md:gap-8">
                                                    <div className={`w-28 h-20 sm:w-36 sm:h-24 md:w-52 md:h-32 rounded-2xl md:rounded-3xl border-4 md:border-8 flex items-center justify-center text-4xl sm:text-5xl md:text-7xl font-normal bg-white transition-all ${shakeLeft ? 'animate-shake border-red-400' : (selectedSyl1 ? 'border-blue-500 text-black shadow-md' : 'border-slate-300 text-slate-300')}`}>{selectedSyl1 || "?"}</div>
                                                    <div className={`w-28 h-20 sm:w-36 sm:h-24 md:w-52 md:h-32 rounded-2xl md:rounded-3xl border-4 md:border-8 flex items-center justify-center text-4xl sm:text-5xl md:text-7xl font-normal bg-white transition-all ${shakeRight ? 'animate-shake border-red-400' : (selectedSyl2 ? 'border-rose-500 text-black shadow-md' : 'border-slate-300 text-slate-300')}`}>{selectedSyl2 || "?"}</div>
                                                </div>
                                                <div className={`transition-all duration-300 flex items-center justify-center rounded-2xl md:rounded-3xl px-8 py-3 md:px-16 md:py-6 shadow-xl min-w-[240px] md:min-w-[420px] min-h-[70px] md:min-h-[110px] ${sylSuccess ? 'bg-green-400 border-4 md:border-6 border-green-600 animate-pop-up' : 'bg-slate-100 border-2 md:border-4 border-slate-200'}`}>
                                                    {sylSuccess && <div className="text-white text-5xl sm:text-6xl md:text-8xl font-normal tracking-wider drop-shadow-sm">{sylData.target}</div>}
                                                </div>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </div>

                    {printData && (
                        <div className="print-show print-stage bg-white text-black font-['TemelYazi']">
                            {printData.level === 1 ? (() => {
                                const setData = PYRAMID_CONTENT[printData.idx % PYRAMID_CONTENT.length];
                                const rows = [ [setData.s], [setData.s, setData.v], [setData.s, setData.o, setData.v], [setData.s, setData.a, setData.o, setData.v], [setData.s, setData.o, setData.v], [setData.s, setData.v], [setData.s] ];
                                const fitLines = rows.map((r, i) => ({ key: i, text: r.join(' ') }));
                                return (
                                    <div className="print-page">
                                        <div className="w-full flex justify-between items-end border-b-[2px] border-slate-400 pb-2 mb-4 shrink-0">
                                            <h2 className="text-[6mm] text-slate-700 font-normal leading-none">Okuma Çalışmaları</h2>

                                        <FitLines
                                            lines={fitLines}

                                            minPx={14}

                                            lineClassName="w-full text-center text-black"
                                        />

                                const story = STORIES[printData.idx % STORIES.length];
                                const sentences = splitSentences(story);

                                return (
                                    <div className="print-page">
                                        <div className="w-full flex justify-between items-end border-b-[2px] border-slate-400 pb-2 mb-4 shrink-0">
                                            <h2 className="text-[6mm] text-slate-700 font-normal leading-none">Okuma Çalışmaları</h2>
                                            <span className="text-[4mm] text-slate-500 font-normal tracking-widest leading-none">OKULATTE</span>
                                        </div>
                                        <FitLines
                                            lines={fitLines}
                                            maxPx={54}
                                            minPx={14}
                                            className="flex-1 w-full flex flex-col justify-evenly overflow-hidden"
                                            lineClassName="w-full text-left text-black"
                                        />
                                    </div>
                                );
                            })()}
                        </div>
                    )}
                </React.Fragment>
            );
        };

        const getLeaderboard = (grade) => {
            const data = localStorage.getItem(`carpmatik_leaderboard_${grade}`);
            return data ? JSON.parse(data) : [];
        };

        const saveScoreToLeaderboard = (grade, name, score) => {
            const currentBoard = getLeaderboard(grade);
            const newEntry = { name, score, date: new Date().toLocaleDateString('tr-TR') };
            const updatedBoard = [...currentBoard, newEntry];
            updatedBoard.sort((a, b) => b.score - a.score);
            const top10 = updatedBoard.slice(0, 10);
            localStorage.setItem(`carpmatik_leaderboard_${grade}`, JSON.stringify(top10));
            return top10;
        };

        const LEADERBOARD_MIN_SCORE = 150;
        const checkQualify = (grade, score) => {
            if (score < LEADERBOARD_MIN_SCORE) return false;
            const currentBoard = getLeaderboard(grade);
            if (currentBoard.length < 10) return true;
            return score > currentBoard[currentBoard.length - 1].score;
        };

        const generateProblem = (questionIndex, previousMultiplier = null, gradeLevel = 2) => {
            let num1, num2;
            if (gradeLevel === 4) {
                const customPool = [
                    {n1:4, n2:4}, {n1:5, n2:4}, {n1:6, n2:4}, {n1:7, n2:4}, {n1:8, n2:4}, {n1:9, n2:4},
                    {n1:4, n2:5}, {n1:5, n2:5}, {n1:6, n2:5}, {n1:7, n2:5}, {n1:8, n2:5}, {n1:9, n2:5},
                    {n1:3, n2:6}, {n1:4, n2:6}, {n1:5, n2:6}, {n1:6, n2:6}, {n1:7, n2:6}, {n1:8, n2:6}, {n1:9, n2:6},
                    {n1:3, n2:7}, {n1:4, n2:7}, {n1:5, n2:7}, {n1:6, n2:7}, {n1:7, n2:7}, {n1:8, n2:7}, {n1:9, n2:7},
                    {n1:3, n2:8}, {n1:4, n2:8}, {n1:5, n2:8}, {n1:6, n2:8}, {n1:7, n2:8}, {n1:8, n2:8}, {n1:9, n2:8},
                    {n1:2, n2:9}, {n1:3, n2:9}, {n1:4, n2:9}, {n1:5, n2:9}, {n1:6, n2:9}, {n1:7, n2:9}, {n1:8, n2:9}, {n1:9, n2:9},
                    {n1:4, n2:10}, {n1:5, n2:10}, {n1:6, n2:10}, {n1:7, n2:10}, {n1:8, n2:10}, {n1:9, n2:10},
                    {n1:7, n2:2}, {n1:8, n2:2}, {n1:9, n2:2}, {n1:11, n2:6}, {n1:12, n2:2}, {n1:11, n2:4}, 
                    {n1:12, n2:3}, {n1:14, n2:2}, {n1:12, n2:5}, {n1:10, n2:11}, {n1:12, n2:10}, {n1:13, n2:10}, 
                    {n1:15, n2:3}, {n1:15, n2:2}, {n1:16, n2:3}, {n1:17, n2:2}, {n1:18, n2:2}
                ];
                const selected = customPool[getRandomInt(0, customPool.length - 1)];
                num1 = selected.n1; num2 = selected.n2;
            } else {
                const isWarmUp = questionIndex < 2;
                let multipliers = [];
                let minNum2 = 2, maxNum2 = 9;

                if (gradeLevel === 2) {
                    multipliers = isWarmUp ? [2] : [3, 4, 5];
                    minNum2 = 3; maxNum2 = 9;
                } else if (gradeLevel === 3) {
                    multipliers = isWarmUp ? [2, 3, 4, 5, 10] : [6, 7, 8, 9];
                    minNum2 = 2; maxNum2 = 10;
                }
                if (!isWarmUp && previousMultiplier !== null && multipliers.length > 1) {
                    multipliers = multipliers.filter(m => m !== previousMultiplier);
                }
                if (multipliers.length === 0) multipliers = [2, 3, 4, 5];
                num1 = multipliers[getRandomInt(0, multipliers.length - 1)];
                num2 = getRandomInt(minNum2, maxNum2);
            }

            const correct = num1 * num2;
            let options = new Set([correct]);
            while (options.size < 3) {
                const range = gradeLevel > 2 ? 8 : 5;
                let distractor = correct + getRandomInt(-range, range); 
                if (distractor > 0 && distractor !== correct) options.add(distractor);
            }

            return { num1, num2, correct, options: Array.from(options).sort(() => Math.random() - 0.5) };
        };

        const LeaderboardModal = ({ grade, onClose }) => {
            const [leaderboard, setLeaderboard] = useState(getLeaderboard(grade));
            const [isResetting, setIsResetting] = useState(false);
            const [password, setPassword] = useState("");
            const [error, setError] = useState(false);

            const handleReset = (e) => {
                e.preventDefault();
                if (password === "semih10") { localStorage.removeItem(`carpmatik_leaderboard_${grade}`); setLeaderboard([]); setIsResetting(false); setPassword(""); } 
                else { setError(true); setTimeout(() => setError(false), 2000); }
            };

            return (
                <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-md flex items-center justify-center p-4 font-['Nunito']">
                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden animate-in">
                        <div className="bg-yellow-400 p-6 flex items-center justify-between border-b-4 border-yellow-500">
                            <div className="flex items-center gap-4"><Icons.Trophy className="text-white w-12 h-12" /><div><h2 className="text-3xl font-black text-white uppercase tracking-wide">Liderlik Tablosu</h2><p className="text-yellow-100 font-bold">{grade}. Sınıf Şampiyonları</p></div></div>
                            <button onClick={onClose} className="bg-white/20 p-2 rounded-full hover:bg-white/40 text-white"><Icons.X size={32} /></button>
                        </div>
                        <div className="p-4 md:p-8 max-h-[60vh] overflow-y-auto scrollbar-hide">
                            {leaderboard.length === 0 ? (<div className="text-center py-10 text-slate-400"><Icons.Trophy size={64} className="mx-auto mb-4 opacity-20" /><p className="text-xl font-bold">Henüz şampiyon yok. İlk sen ol!</p></div>) : (
                                <table className="w-full">
                                    <thead><tr className="text-left border-b-2 border-slate-100"><th className="pb-2 md:pb-4 text-slate-400 font-bold uppercase text-xs md:text-sm">Sıra</th><th className="pb-2 md:pb-4 text-slate-400 font-bold uppercase text-xs md:text-sm">İsim</th><th className="pb-2 md:pb-4 text-slate-400 font-bold uppercase text-xs md:text-sm text-right">Puan</th></tr></thead>
                                    <tbody className="divide-y divide-slate-50">
                                        {leaderboard.map((entry, idx) => (
                                            <tr key={idx} className={`group transition-colors hover:bg-yellow-50 ${idx === 0 ? 'text-yellow-600 font-black text-xl md:text-2xl' : ''} ${idx === 1 ? 'text-slate-600 font-bold text-lg md:text-xl' : ''} ${idx === 2 ? 'text-orange-700 font-bold text-lg md:text-xl' : ''} ${idx > 2 ? 'text-slate-500 font-bold text-base md:text-lg' : ''}`}>
                                                <td className="py-3 pl-2">{idx === 0 && '🥇'}{idx === 1 && '🥈'}{idx === 2 && '🥉'}{idx > 2 && `${idx + 1}.`}</td>
                                                <td className="py-3">{entry.name}</td><td className="py-3 text-right">{entry.score}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            )}
                        </div>
                        <div className="p-4 bg-slate-50 border-t border-slate-100 flex justify-between items-center">
                            <span className="text-slate-400 text-xs md:text-sm font-bold">150 puan ve üzeri girer · Sadece bu cihazda saklanır.</span>
                            {!isResetting ? (
                                <button onClick={() => setIsResetting(true)} className="text-red-400 hover:text-red-600 text-sm font-bold flex items-center gap-1"><Icons.Trash2 size={16} /> Sıfırla</button>
                            ) : (
                                <form onSubmit={handleReset} className="flex gap-2 items-center">
                                    <input type="password" value={password} onChange={(e) => setPassword(e.target.value)} placeholder="Şifre" className={`border-2 rounded px-2 py-1 text-sm w-24 outline-none ${error ? 'border-red-500 bg-red-50' : 'border-slate-300'}`} autoFocus />
                                    <button type="submit" className="bg-red-500 text-white px-3 py-1 rounded text-sm font-bold">Onayla</button>
                                </form>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const NameInputModal = ({ score, grade, team, onSave, onSkip }) => {
            const [name, setName] = React.useState(""); 
            const handleSubmit = (e) => { e.preventDefault(); if (name.trim().length > 0) onSave(name); };
            return (
                <div className="fixed inset-0 z-[100] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 font-['Nunito']">
                    <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-lg w-full text-center animate-in border-4 border-yellow-400">
                        <Icons.Trophy className="w-20 h-20 md:w-24 md:h-24 text-yellow-400 mx-auto mb-6 animate-bounce" />
                        <h2 className="text-3xl md:text-4xl font-black text-slate-800 mb-2">TEBRİKLER!</h2>
                        {team && <p className={`text-lg md:text-xl font-black mb-1 ${team === 'red' ? 'text-red-500' : 'text-blue-500'}`}>{team === 'red' ? 'Kırmızı Takım' : 'Mavi Takım'}</p>}
                        <p className="text-slate-500 text-lg md:text-xl font-bold mb-6"><span className="text-yellow-500 font-black text-2xl">{score}</span> Puan ile Liderlik Tablosuna Girdin!</p>
                        <form onSubmit={handleSubmit} className="flex flex-col gap-4">
                            <input type="text" value={name} onChange={(e) => setName(e.target.value)} placeholder="İsminizi Giriniz" className="w-full bg-slate-100 border-2 border-slate-200 rounded-xl p-4 text-xl font-bold text-center focus:outline-none focus:border-yellow-400" maxLength={20} autoFocus />
                            <button type="submit" disabled={name.trim().length === 0} className="bg-yellow-400 text-white p-4 rounded-xl text-xl font-black hover:bg-yellow-500 border-b-4 border-yellow-600 active:border-b-0 active:translate-y-1 disabled:opacity-50 flex items-center justify-center gap-2"><Icons.Save />KAYDET</button>
                            <button type="button" onClick={onSkip} className="text-slate-400 hover:text-slate-600 font-bold text-sm underline">Kaydetmeden geç</button>
                        </form>
                    </div>
                </div>
            );
        };

        const ConfirmModal = ({ message, onConfirm, onCancel }) => (
            <div className="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 font-['Nunito']">
                <div className="bg-white rounded-3xl shadow-2xl p-8 max-w-md w-full text-center animate-in">
                    <h3 className="text-xl md:text-2xl font-bold text-slate-800 mb-6">{message}</h3>
                    <div className="flex gap-4 justify-center">
                        <button onClick={onCancel} className="flex-1 bg-slate-200 text-slate-700 py-3 rounded-xl font-bold text-lg border-b-4 border-slate-300 active:border-b-0 active:translate-y-1">İptal</button>
                        <button onClick={onConfirm} className="flex-1 bg-red-500 text-white py-3 rounded-xl font-bold text-lg border-b-4 border-red-700 active:border-b-0 active:translate-y-1">Evet</button>
                    </div>
                </div>
            </div>
        );

        const CarpmatikPlayerCard = ({ teamColor, score, setScore, isActive, timeLeft, gradeLevel, isFrozen, setIsFrozen }) => {
            const questionIndexRef = useRef(0);
            const [problem, setProblem] = useState(() => generateProblem(0, null, gradeLevel));
            const [wrongAttempts, setWrongAttempts] = useState(0); 
            const [disabledOptions, setDisabledOptions] = useState([]);
            const [feedback, setFeedback] = useState(null);
            const [consecutiveWrongs, setConsecutiveWrongs] = useState(0); 
            const [freezeTime, setFreezeTime] = useState(0); 

            useEffect(() => {
                if (!isActive) return;
                if (timeLeft === 60) {
                    questionIndexRef.current = 0; setProblem(generateProblem(0, null, gradeLevel));
                    setWrongAttempts(0); setDisabledOptions([]); setFeedback(null); setConsecutiveWrongs(0); setIsFrozen(false);
                }
            }, [isActive, timeLeft, gradeLevel, setIsFrozen]);

            useEffect(() => {
                let interval;
                if (isFrozen && freezeTime > 0) interval = setInterval(() => setFreezeTime((prev) => prev - 1), 1000);
                else if (isFrozen && freezeTime === 0) setIsFrozen(false); 
                return () => clearInterval(interval);
            }, [isFrozen, freezeTime, setIsFrozen]);

            const nextTimerRef = useRef(null);
            useEffect(() => () => clearTimeout(nextTimerRef.current), []);

            const nextQuestion = (delay = 1000) => {
                clearTimeout(nextTimerRef.current);
                nextTimerRef.current = setTimeout(() => {
                    questionIndexRef.current += 1;
                    setProblem(prevProblem => generateProblem(questionIndexRef.current, prevProblem.num1, gradeLevel));
                    setWrongAttempts(0); setDisabledOptions([]); setFeedback(null);
                }, delay);
            };

            const handleOptionClick = (option) => {
                if (!isActive || isFrozen || feedback === 'correct' || feedback === 'fail') return;
                if (option === problem.correct) {
                    setConsecutiveWrongs(0); setFeedback('correct'); setScore(s => s + 10); nextQuestion(500);
                } else {
                    setScore(s => Math.max(0, s - 10));
                    const newStreak = consecutiveWrongs + 1; setConsecutiveWrongs(newStreak);
                    if (newStreak >= 3) { setIsFrozen(true); setFreezeTime(3); setConsecutiveWrongs(0); }
                    if (wrongAttempts === 0) {
                        setFeedback('wrong'); setDisabledOptions([...disabledOptions, option]); setWrongAttempts(1); setTimeout(() => setFeedback(null), 300);
                    } else { setFeedback('fail'); nextQuestion(1000); }
                }
            };

            const isRed = teamColor === 'red';
            const borderColor = isRed ? 'border-red-400' : 'border-blue-400';
            const textColor = isRed ? 'text-red-500' : 'text-blue-500';
            const shadowClass = isRed ? 'shadow-[0_10px_40px_-10px_rgba(248,113,113,0.5)]' : 'shadow-[0_10px_40px_-10px_rgba(96,165,250,0.5)]';
            const freezeBg = isRed ? 'bg-red-900/90' : 'bg-blue-900/90';

            return (
                <div className={`relative flex flex-col items-center bg-white border-[4px] md:border-[6px] ${borderColor} rounded-3xl md:rounded-[2.5rem] w-full max-w-lg h-full max-h-[42vh] md:max-h-none md:h-[min(68vh,42rem)] mx-1 md:mx-4 ${shadowClass} overflow-hidden transition-all duration-300 font-['Nunito']`}>
                    {isFrozen && (
                        <div className={`absolute inset-0 z-50 ${freezeBg} backdrop-blur-sm flex flex-col items-center justify-center text-white animate-in`}>
                            <Icons.Lock size={60} className="mb-2 md:mb-4 animate-bounce" />
                            <h2 className="text-2xl md:text-4xl font-black uppercase tracking-widest mb-1 md:mb-2">DİKKAT!</h2>
                            <p className="text-base md:text-xl font-bold mb-4 md:mb-6">3 Yanlış Yaptın!</p>
                            <div className="text-4xl md:text-6xl font-black bg-white/20 w-16 h-16 md:w-24 md:h-24 rounded-full flex items-center justify-center border-4 border-white">{freezeTime}</div>
                        </div>
                    )}
                    <div className="mt-3 md:mt-6 flex flex-col items-center w-full">
                        <span className="text-gray-400 text-sm md:text-xl font-bold tracking-widest uppercase mb-1">Puan</span>
                        <div className="bg-yellow-300 px-6 md:px-8 py-1 md:py-2 rounded-xl md:rounded-2xl border-b-4 border-yellow-500 flex items-center justify-center shadow-sm"><span className="text-3xl md:text-4xl text-gray-900 font-extrabold">{score}</span></div>
                    </div>
                    <div className="flex-1 flex items-center justify-center my-2">
                        {isActive ? (
                            <div className={`text-6xl md:text-[8rem] leading-none ${textColor} font-black tracking-normal drop-shadow-sm flex items-center gap-2 md:gap-4`}>
                                <span>{problem.num1}</span><span className="text-5xl md:text-[5rem] text-black mt-2">x</span><span>{problem.num2}</span>
                            </div>
                        ) : (
                            <div className="text-6xl md:text-[8rem] leading-none text-slate-300 font-black flex items-center gap-2 md:gap-4">
                                <span>-</span><span className="text-5xl md:text-[5rem] text-slate-200 mt-2">x</span><span>-</span>
                            </div>
                        )}
                    </div>
                    <div className="flex flex-col gap-2 md:gap-4 w-full px-4 md:px-10 mb-4 md:mb-8">
                        {isActive ? (
                            problem.options.map((opt, idx) => {
                                const isDisabled = disabledOptions.includes(opt);
                                const isCorrect = feedback === 'correct' && opt === problem.correct;
                                let btnStyle = isCorrect ? "bg-gradient-to-b from-green-400 to-green-600 border-green-800 text-white scale-105" : isDisabled ? "bg-gray-200 border-gray-300 text-gray-400 opacity-50" : "bg-gradient-to-b from-gray-50 to-gray-200 border-gray-400 text-slate-800 hover:scale-[1.02] active:scale-95 shadow-md";
                                return (
                                    <button key={idx} onClick={() => handleOptionClick(opt)} disabled={isDisabled || !isActive || isFrozen} className={`h-12 md:h-20 w-full rounded-xl md:rounded-2xl border-b-4 md:border-b-[6px] text-3xl md:text-6xl font-black transition-all ${btnStyle}`}>{opt}</button>
                                );
                            })
                        ) : (
                            [1, 2, 3].map((_, idx) => <div key={idx} className="h-12 md:h-20 w-full rounded-xl md:rounded-2xl border-b-4 md:border-b-[6px] border-slate-200 bg-slate-100 flex items-center justify-center text-slate-300 text-3xl md:text-5xl font-bold">-</div>)
                        )}

        const dmCalculateProportionalScore = (student) => {
            let absentCount = 0;
            let actualScore = 0;
            const absents = student.absentDays || {};
            const daily = student.daily || {};
            for (let i = 1; i <= 5; i++) {
                if (absents[i]) { absentCount++; } 
                else { actualScore += (daily[i] || 0); }
            }
            const attendedDays = 5 - absentCount;
            if (attendedDays === 0) return { proportional: 0, actualScore, attendedDays, maxPossible: 0, absentCredit: 0 };

            // Gelmediği (kilitlenen) günler: geldiği günlerdeki ortalamaya göre puan
            //  ortalama >= 8 -> gelmediği her gün 3 puan | 6 <= ortalama < 8 -> 2 puan | ortalama < 6 -> 0 puan
            const avg = actualScore / attendedDays;
            const perAbsent = avg >= 8 ? 3 : (avg >= 6 ? 2 : 0);
            const absentCredit = absentCount * perAbsent;
            let proportional = actualScore + absentCredit;
            if (proportional > 50) proportional = 50;
            if (proportional < -50) proportional = -50;

            return { proportional, actualScore, attendedDays, maxPossible: attendedDays * 10, absentCredit };
        };

                case 'panda': fill = '#f5f3ff'; belly = null;

                        <circle cx="37" cy="57" r="3.6" fill="#fff" /><circle cx="63" cy="57" r="3.6" fill="#fff" /><circle cx="37.6" cy="57.4" r="1.8" fill={eye} /><circle cx="62.4" cy="57.4" r="1.8" fill={eye} />

        const DM_STICKER_COUNT = 10; // assets/stickers/1.svg ... 10.svg
